<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sillah Kanu Series — Letter Match</title>
<style>
  :root{
    --paper:#FFFDF6;
    --board:#F3EAD6;
    --ink:#1A1A1A;
    --rule:#D8CBAE;
    --tray:#3E2A18;
    --tray2:#573A21;
    --tile:64px;
    --font-hand:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--font-hand);background:var(--board);color:var(--ink);
    overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation;
  }
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{
    flex:0 0 auto;text-align:center;padding:7px 10px;
    background:var(--paper);border-bottom:3px solid var(--ink);
  }
  header h1{
    margin:0;font-size:clamp(13px,3.6vw,24px);line-height:1.2;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;
  }
  header p{margin:4px 0 0;font-size:clamp(10px,2.6vw,13px);color:#6B5A42}

  main{flex:1;min-height:0;display:flex;justify-content:center;padding:8px;overflow:hidden}
  .card{
    flex:1;min-width:0;min-height:0;max-width:900px;width:100%;
    display:flex;flex-direction:column;gap:8px;
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px;
  }

  .board{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,4vw,40px);position:relative;
  }
  .slot{
    display:flex;align-items:center;justify-content:center;
    width:clamp(96px,26vw,180px);height:clamp(96px,26vw,180px);
    border-radius:18px;font-weight:bold;line-height:1;
    font-size:clamp(52px,15vw,104px);
  }
  .ask{background:#FFE9A8;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
  .drop{
    background:#fff;border:5px dashed var(--rule);color:var(--ink);
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .drop.over{border-color:#1FA13A;background:#EFFBEF;transform:scale(1.05)}
  .drop.right{border:5px solid #1FA13A;background:#EFFBEF}
  .drop.wrong{border-color:#E8112D;animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)} 40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
  .arrow{font-size:clamp(22px,6vw,40px);color:#8A7B60}

  .face{
    position:absolute;left:50%;top:6px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    background:#FFE9A8;border:3px solid var(--ink);border-radius:22px;
    padding:5px 16px;font-size:clamp(13px,3.4vw,19px);
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .face.show{opacity:1}
  .face svg{width:26px;height:26px;display:block}

  /* balloons for a right answer */
  .balloons{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .balloon{position:absolute;bottom:-90px;width:44px;height:74px;animation:rise 2.6s ease-out forwards}
  .balloon svg{width:100%;height:100%;display:block}
  @keyframes rise{
    0%  {transform:translateY(0) rotate(0deg);opacity:0}
    10% {opacity:1}
    80% {opacity:1}
    100%{transform:translateY(calc(-1 * var(--rise))) rotate(var(--tw));opacity:0}
  }

  .score{flex:0 0 auto;text-align:center;font-size:clamp(12px,3.2vw,16px);color:#6B5A42}

  .tray{
    flex:0 0 auto;background:linear-gradient(var(--tray2),var(--tray));
    border-top:4px solid #241505;padding:6px 8px max(8px,env(safe-area-inset-bottom));
  }
  .traytop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .traytop p{margin:0;color:#FFE9C4;font-size:clamp(10px,2.8vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .traytop button{
    flex:0 0 auto;font-family:var(--font-hand);font-size:clamp(11px,3vw,14px);
    padding:6px 10px;border:2px solid #241505;border-radius:9px;background:#FFE9C4;cursor:pointer;
  }
  .letters{
    display:grid;gap:var(--gap);padding:2px 0 4px;justify-content:center;
    grid-template-columns:repeat(var(--cols), var(--tile));
  }
  .tile{
    width:var(--tile);height:var(--tile);padding:0;
    border:3px solid var(--ink);border-radius:12px;background:#fff;
    font-family:var(--font-hand);font-size:calc(var(--tile) * .52);font-weight:bold;
    cursor:grab;touch-action:none;box-shadow:0 3px 0 #241505;
    display:flex;align-items:center;justify-content:center;
  }
  .tile.picked{background:#FFE9A8;transform:translateY(-4px)}
  .tile.hidden{visibility:hidden}
  .flying{
    position:fixed;z-index:50;pointer-events:none;margin:0;
    box-shadow:0 8px 0 rgba(36,21,5,.35);transform:scale(1.12);
  }

  @media (min-width:700px){ :root{} .card{padding:14px;gap:10px} }
  @media (min-width:1100px){ :root{} }
  @media (max-height:720px) and (orientation:portrait){ :root{} header p{display:none} }
  @media (max-height:560px) and (orientation:landscape){
    header{padding:4px 8px} header p{display:none}
    main{padding:5px} .card{padding:8px;gap:5px}
    .slot{width:clamp(70px,18vh,120px);height:clamp(70px,18vh,120px);font-size:clamp(36px,11vh,72px)}
    .score{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .balloon{animation-duration:.01s}
    .drop.wrong{animation:none}
  }
</style>
</head>
<body>
<div class="shell">

<header>
  <h1>Sillah Kanu Series — Letter Match</h1>
  <p>Drag the same letter into the empty box</p>
</header>

<main>
  <div class="card">
    <div class="board" id="board">
      <div class="slot ask" id="ask">A</div>
      <div class="arrow">&#10230;</div>
      <div class="slot drop" id="drop" aria-label="Put the matching letter here"></div>
      <div class="balloons" id="balloons"></div>
      <div class="face" id="face"><span id="faceIcon"></span><span id="faceText"></span></div>
    </div>
    <p class="score" id="score">Matched 0</p>
  </div>
</main>

<div class="tray">
  <div class="traytop">
    <p id="hint">Find the letter A</p>
    <button id="again">New letter</button>
  </div>
  <div class="letters" id="letters"></div>
</div>

</div>

<script>
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const SOUND = {A:"ay", B:"bee", C:"see", D:"dee", E:"ee", F:"eff", G:"jee", H:"aitch",
  I:"eye", J:"jay", K:"kay", L:"ell", M:"em", N:"en", O:"oh", P:"pee", Q:"cue", R:"ar",
  S:"ess", T:"tee", U:"you", V:"vee", W:"double you", X:"ex", Y:"why", Z:"zed"};

const askEl   = document.getElementById("ask");
const dropEl  = document.getElementById("drop");
const trayEl  = document.getElementById("letters");
const faceEl  = document.getElementById("face");
const balloonBox = document.getElementById("balloons");
let target = "A";
let matched = 0;
let busy = false;          // true while a right answer is being celebrated
let picked = null;         // letter chosen by tapping (instead of dragging)

/* ---------- saying things out loud ---------- */
const canSpeak = "speechSynthesis" in window;
let voice = null;
function pickVoice(){
  if(!canSpeak) return null;
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || []; }catch(e){ return null; }
  const en = vs.filter(v=>/^en/i.test(v.lang||""));
  return en.find(v=>/GB|UK/i.test(v.lang)) || en[0] || vs[0] || null;
}
if(canSpeak){
  voice = pickVoice();
  try{ speechSynthesis.onvoiceschanged = ()=>{ voice = pickVoice(); }; }catch(e){}
}
function say(t, done){
  let called = false;
  const finish = ()=>{ if(!called){ called = true; if(done) done(); } };
  if(!canSpeak){ setTimeout(finish, 700); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.rate = .8; u.pitch = 1.15; u.lang = (voice && voice.lang) || "en-GB";
    if(voice) u.voice = voice;
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
    // some phones never fire onend, so allow enough time for the words anyway
    setTimeout(finish, 900 + t.length * 90);
  }catch(e){ setTimeout(finish, 700); }
}

/* ---------- the letter tiles ---------- */
LETTERS.forEach(L=>{
  const b = document.createElement("button");
  b.className = "tile"; b.textContent = L; b.dataset.letter = L;
  b.setAttribute("aria-label", "letter " + L);
  trayEl.appendChild(b);
});

/* ---------- make every letter fit on the screen at once ---------- */
function fitTiles(){
  const box = trayEl.parentElement.getBoundingClientRect();
  const avail = box.width - 16;
  if(avail < 60) return;
  const short = window.innerHeight < 560;
  // how much height the tray may take before it starts squeezing the game
  const budget = Math.max(78, Math.min(window.innerHeight * (short ? 0.42 : 0.34), 330));
  const gap = window.innerWidth < 420 ? 5 : 7;
  let best = {size:0, cols:13};
  for(let cols = 4; cols <= 26; cols++){
    const rows = Math.ceil(26 / cols);
    const byW = (avail - (cols-1)*gap) / cols;
    const byH = (budget - (rows-1)*gap - 26) / rows;   // 26px for the row of buttons above
    const size = Math.min(byW, byH);
    if(size > best.size) best = {size, cols};
  }
  const size = Math.max(30, Math.min(88, Math.floor(best.size)));
  document.documentElement.style.setProperty("--tile", size + "px");
  document.documentElement.style.setProperty("--cols", best.cols);
  document.documentElement.style.setProperty("--gap", gap + "px");
}
let fitTimer = null;
window.addEventListener("resize", ()=>{ clearTimeout(fitTimer); fitTimer = setTimeout(fitTiles, 90); });
window.addEventListener("orientationchange", ()=>setTimeout(fitTiles, 140));

/* ---------- a new round ---------- */
function newRound(speak){
  let n = target;
  while(n === target) n = LETTERS[Math.floor(Math.random()*LETTERS.length)];
  target = n;
  askEl.textContent = target;
  dropEl.textContent = "";
  dropEl.className = "slot drop";
  faceEl.classList.remove("show");
  document.getElementById("hint").textContent = "Find the letter " + target;
  clearPick();
  busy = false;
  if(speak) say("Find the letter " + SOUND[target]);
}

function clearPick(){
  picked = null;
  [...trayEl.children].forEach(t=>t.classList.remove("picked"));
}

/* ---------- right and wrong ---------- */
function showFace(kind, text){
  document.getElementById("faceIcon").innerHTML = kind === "sad"
    ? `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/>
         <circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/>
         <path d="M8 17c1.6-2.2 6.4-2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>`
    : `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/>
         <circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/>
         <path d="M8 14c1.6 2.2 6.4 2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>`;
  document.getElementById("faceText").textContent = text;
  faceEl.classList.add("show");
}

function popBalloons(){
  const cols = ["#E8112D","#1E90FF","#1FA13A","#7A1FD1","#F5821F","#FF3EA5","#FFD200"];
  const board = document.getElementById("board").getBoundingClientRect();
  const rise = Math.round(board.height + 140);      // right up past the top of the picture
  const flight = 2600, spread = 500;
  for(let i=0; i<9; i++){
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = (6 + Math.random()*84) + "%";
    b.style.animationDelay = (Math.random()*spread) + "ms";
    b.style.setProperty("--rise", rise + "px");
    b.style.setProperty("--tw", (Math.random()*40-20) + "deg");
    const c = cols[i % cols.length];
    b.innerHTML = `<svg viewBox="0 0 44 74">
      <path d="M22,2 C34,2 40,12 40,22 C40,34 31,44 22,44 C13,44 4,34 4,22 C4,12 10,2 22,2 Z"
            fill="${c}" stroke="#1A1A1A" stroke-width="2.5"/>
      <path d="M22,43 L18,50 L26,50 Z" fill="${c}" stroke="#1A1A1A" stroke-width="2.5"/>
      <path d="M22,50 C28,58 16,62 22,72" fill="none" stroke="#1A1A1A" stroke-width="2"/>
      <ellipse cx="14" cy="16" rx="4" ry="6" fill="#fff" opacity=".45"/></svg>`;
    balloonBox.appendChild(b);
    setTimeout(()=>b.remove(), flight + spread + 400);
  }
  return flight + spread;                            // how long the balloons need
}

function tryLetter(L){
  if(busy) return;
  if(L === target){
    busy = true;
    dropEl.textContent = L;
    dropEl.classList.remove("over");
    dropEl.classList.add("right");
    matched++;
    document.getElementById("score").textContent = "Matched " + matched;
    showFace("happy", "Well done!");
    const flight = popBalloons();
    let waiting = 2;
    const ready = ()=>{ if(--waiting === 0) newRound(true); };
    say("Yes! That is " + SOUND[L], ready);          // wait for the words to finish
    setTimeout(ready, flight);                        // and for the balloons to reach the top
  } else {
    dropEl.classList.remove("over","wrong");
    void dropEl.offsetWidth;                 // restart the shake
    dropEl.classList.add("wrong");
    showFace("sad", "Try again");
    say("Try again");
    setTimeout(()=>{
      dropEl.classList.remove("wrong");
      faceEl.classList.remove("show");
    }, 1600);
  }
  clearPick();
}

/* ---------- dragging a tile ---------- */
let drag = null;
function overDrop(x, y){
  const r = dropEl.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

trayEl.addEventListener("pointerdown", e=>{
  const tile = e.target.closest(".tile");
  if(!tile || busy) return;
  try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  const r = tile.getBoundingClientRect();
  const ghost = tile.cloneNode(true);
  ghost.classList.add("flying");
  ghost.style.width = r.width + "px";
  ghost.style.height = r.height + "px";
  ghost.style.left = r.left + "px";
  ghost.style.top = r.top + "px";
  document.body.appendChild(ghost);
  tile.classList.add("hidden");
  drag = {tile, ghost, id:e.pointerId, dx:e.clientX-r.left, dy:e.clientY-r.top, moved:false,
          startX:e.clientX, startY:e.clientY};
});

window.addEventListener("pointermove", e=>{
  if(!drag || e.pointerId !== drag.id) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + "px";
  drag.ghost.style.top  = (e.clientY - drag.dy) + "px";
  if(Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY) > 6) drag.moved = true;
  dropEl.classList.toggle("over", overDrop(e.clientX, e.clientY) && !busy);
});

window.addEventListener("pointerup", e=>{
  if(!drag || e.pointerId !== drag.id) return;
  const {tile, ghost, moved} = drag;
  ghost.remove();
  tile.classList.remove("hidden");
  dropEl.classList.remove("over");
  drag = null;
  if(moved){
    if(overDrop(e.clientX, e.clientY)) tryLetter(tile.dataset.letter);
  }else{
    // a tap picks the letter up; then tap the empty box to drop it
    clearPick();
    picked = tile.dataset.letter;
    tile.classList.add("picked");
    say(SOUND[picked]);
  }
});

window.addEventListener("pointercancel", ()=>{
  if(!drag) return;
  drag.ghost.remove();
  drag.tile.classList.remove("hidden");
  dropEl.classList.remove("over");
  drag = null;
});

dropEl.addEventListener("click", ()=>{ if(picked) tryLetter(picked); });
document.getElementById("again").onclick = ()=>newRound(true);
askEl.addEventListener("click", ()=>say("Find the letter " + SOUND[target]));

fitTiles();
newRound(false);
</script>
</body>
</html>
